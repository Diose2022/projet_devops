version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:18.20.5
    working_directory: ~/project

jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"

  playwright-test:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run Playwright tests
          command: npx playwright test

workflows:
  say-hello-workflow:
    jobs:
      - say-hello
      - playwright-test:
          requires:
            - say-hello
